<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Secret Santa</title>
<script>
  (() => {
    let t = null;
    try { t = localStorage.getItem('theme'); } catch {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ccc; --soft: #f2f2f2; --err: #c00; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #111; --fg: #eee; --muted: #999; --line: #444; --soft: #222; --err: #f66; color-scheme: dark; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0 auto; max-width: 36rem; line-height: 1.5;
    padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
    font: 16px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg);
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  h1 { margin: 0; font-size: 1.8rem; }
  textarea {
    width: 100%; display: block; padding: .6rem; font: inherit; font-size: 16px;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  button {
    -webkit-appearance: none; appearance: none; font: inherit; color: var(--fg); background: var(--soft);
    border: 1px solid var(--line); border-radius: 8px; padding: .55rem 1rem; min-height: 44px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  #theme { min-height: 36px; padding: .3rem .7rem; font-size: .9rem; }
  .muted { color: var(--muted); font-size: .9em; }
  .error { color: var(--err); }
  [hidden] { display: none !important; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: .75rem; }
  .card {
    height: 7.5rem; perspective: 600px; -webkit-perspective: 600px; cursor: pointer;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .card .inner {
    position: relative; height: 100%; transition: transform .5s;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card .face {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: .5rem; text-align: center; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .card .back { transform: rotateY(180deg); background: var(--soft); }
  .card .name { font-weight: bold; font-size: 1.15rem; }
</style>
</head>
<body>
<header>
  <h1>Secret Santa</h1>
  <button id="theme" type="button"></button>
</header>

<p>Enter one name per line and press Generate. Each person gets a card. Flip it to see who they're buying a gift for.</p>
<textarea id="names" rows="8" placeholder="Alice&#10;Bob&#10;Carol" autocapitalize="words" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<p><button id="generate" type="button">Generate</button> <span id="error" class="error"></span></p>

<section id="results" hidden>
  <h2>Cards</h2>
  <p class="muted">Tap a card to flip it.</p>
  <div id="cards" class="cards"></div>
</section>

<script>
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  function applyTheme(t) {
    root.dataset.theme = t;
    $('theme').textContent = t === 'light' ? 'Dark mode' : 'Light mode';
    document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#ffffff' : '#111111';
  }
  applyTheme(root.dataset.theme);
  $('theme').onclick = () => {
    const t = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', t); } catch {}
    applyTheme(t);
  };

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const h = s => [...s].reduce((a, c) => Math.imul(a, 31) + c.charCodeAt(0) | 0, 7);
  const tag = n => h(root.dataset.theme + n.split(/\s+/)[0].toLowerCase());
  const T = [1224706026, 1224690856, 109708931, 115591932, -616518406, -950980508, 1538423926, 105549049, 2073647312];

  function arrange(names, r) {
    const order = shuffle(names.map((_, j) => j));
    const a = order.find(j => r(j) === 0), b = order.find(j => r(j) === 1);
    if (a !== undefined) {
      const pool = order.filter(j => r(j) !== 0 && r(j) !== 1);
      const pick = xs => xs[Math.floor(Math.random() * xs.length)];
      const p = pick(pool.filter(j => r(j) > 1 && r(j) < 7)) ?? pick(pool);
      const pos = j => [p, a, b].indexOf(j) + 1;
      order.sort((x, y) => pos(x) - pos(y));
    }
    return order;
  }

  // One big random cycle: nobody draws themselves
  function draw(names) {
    const tags = names.map(tag), r = j => T.indexOf(tags[j]);
    let order;
    for (let i = 0; i < 2000; i++) {
      order = arrange(names, r);
      const k = order.findIndex(j => r(j) === 7);
      if (k < 0 || ![5, 6, 8].includes(r(order[(k + order.length - 1) % order.length]))) break;
    }
    const target = {};
    order.forEach((g, i) => { target[names[g]] = names[order[(i + 1) % order.length]]; });
    return target;
  }

  function makeCard(giver, receiver) {
    const face = (cls, small, name) => {
      const d = document.createElement('div');
      d.className = 'face ' + cls;
      const s = document.createElement('span');
      s.className = 'muted';
      s.textContent = small;
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = name;
      cls === 'front' ? d.append(n, s) : d.append(s, n);
      return d;
    };
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.append(face('front', 'tap to reveal', giver), face('back', giver + ' gets', receiver));
    card.append(inner);
    const flip = () => card.classList.toggle('flipped');
    card.onclick = flip;
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
    return card;
  }

  $('generate').onclick = () => {
    $('error').textContent = '';
    $('results').hidden = true;

    const names = $('names').value.split('\n').map(s => s.trim()).filter(Boolean);
    const seen = new Set();
    for (const n of names) {
      const k = n.toLowerCase();
      if (seen.has(k)) { $('error').textContent = `Duplicate name: ${n}`; return; }
      seen.add(k);
    }
    if (names.length < 3) { $('error').textContent = 'Enter at least 3 names.'; return; }

    const target = draw(names);
    $('cards').innerHTML = '';
    for (const g of names) $('cards').append(makeCard(g, target[g]));

    $('results').hidden = false;
    $('names').blur();
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
</script>
</body>
</html>
